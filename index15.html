<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
    font-family:Arial;
}
.box{
    width:400px;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.2);
    text-align:center;
}
h2{
    color:#2a6fc2;
}
.task-input{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}
.task-input input{
    width:70%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}
.add-btn{
    background:#2a6fc2;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
}
.task{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-radius:1px;
    box-shadow:0 0 1px rgba(0,0,0,0.2);
}
.done{
    text-decoration:line-through;
    color:gray;
}
.remove{
    background:#ff5c5c;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:6px;
}
/* .k{
    border:2px solid #2a6fc2;
    border: radius 15px;
    padding:3px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
} */
.check {
            height: 15px;
            width: 5px;
            border-bottom: 5px solid green;
            border-right: 5px solid green;
            transform: rotate(45deg);
            margin: 5px;
        }
</style>
</head>
<body>
<div class="box">
<h2>Task Manager</h2>
<div class="task-input">
<input type="text" placeholder="What needs to be done?">
<button class="add-btn">Add Task</button>
</div>
<div class="task">
<i class="fa-solid fa-check"></i>
<span class="done"> Task A</span>
<button class="remove">Remove</button>
</div>
<div class="task">
<i class="fa-solid fa-check"></i>
<span> Task B</span>
<button class="remove">Remove</button>
</div>
<div class="task">
<!-- <span class="k">
<i class="fa-solid fa-check"></i>
</span> -->
<div class="check"></div>
<span class="done"> Task C</span>
<button class="remove">Remove</button>
</div>
</div>
</body>
</html>
