<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Collage Layout</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap"
    rel="stylesheet" />
  <style>
    body {
      background: #8fa3ab;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Lato', sans-serif;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 2rem;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      font-style: italic;
    }

    .collage-wrapper {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      grid-template-rows: auto auto;
      gap: 16px;
      max-width: 1140px;
      width: 100%;
    }

    .panel {
      background: #fff;
      padding: 12px;
      box-shadow: 0 8px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .panel div {
      overflow: hidden;
    }

    .panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.4s ease;
      cursor: pointer;
    }

    .panel img:hover {
      transform: scale(1.04);
      filter: brightness(1.07) saturate(1.1);
    }

    .panel-1 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 275px;
      gap: 8px;
    }

    .panel-2 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 155px 120px;
      gap: 8px;
    }

    .p2-a {
      grid-column: 1 / 3;
      grid-row: 1 / 2;
    }

    .p2-b {
      grid-column: 3 / 4;
      grid-row: 1 / 3;
    }

    .p2-c {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }

    .p2-d {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
    }

    .panel-3 {
      display: grid;
      grid-template-columns: 1.5fr 0.85fr 1.15fr;
      grid-template-rows: 150px 110px 90px;
      gap: 8px;
    }

    .p3-a {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
    }

    .p3-b {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
    }

    .p3-c {
      grid-column: 3 / 4;
      grid-row: 1 / 3;
    }

    .p3-d {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
    }

    .p3-e {
      grid-column: 1 / 2;
      grid-row: 3 / 4;
    }

    .p3-f {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
    }

    .p3-g {
      grid-column: 3 / 4;
      grid-row: 3 / 4;
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      overflow: visible !important;
    }

    .p3-g>div {
      overflow: hidden;
      height: 100%;
    }

    .panel-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 105px 80px 115px 80px;
      gap: 8px;
    }

    .p4-a {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    .p4-b {
      grid-column: 2 / 3;
      grid-row: 1 / 3;
    }

    .p4-c {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }

    .p4-d {
      grid-column: 1 / 3;
      grid-row: 3 / 4;
    }

    .p4-e {
      grid-column: 1 / 2;
      grid-row: 4 / 5;
    }

    .p4-f {
      grid-column: 2 / 3;
      grid-row: 4 / 5;
    }

    @media (max-width: 720px) {
      .collage-wrapper {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
